name: 🚀 Deploy to Fly 🚀

on:
  push:
  workflow_dispatch:
    branches:
      - main
    paths:
      - "client/**"

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
  PUBLIC_URL: ${{ secrets.PUBLIC_URL }}

jobs:
  deploy:
      name: Deploy app
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v2
        - uses: superfly/flyctl-actions/setup-flyctl@master
        - run: flyctl deploy client/ --remote-only --build-arg GA_TRACKING_ID=${GA_TRACKING_ID},PUBLIC_URL=${PUBLIC_URL}