name: Fly Deploy

on:
  push:
  workflow_dispatch:
    branches:
      - main
    paths:
      - "client/**"

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  REACT_APP_GA_TRACKING_ID: ${{ secrets.REACT_APP_GA_TRACKING_ID }}

jobs:
  deploy:
      name: Deploy app
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v2
        - uses: superfly/flyctl-actions/setup-flyctl@master
        - run: flyctl deploy client/ --build-secret REACT_APP_GA_TRACKING_ID=REACT_APP_GA_TRACKING_ID --remote-only