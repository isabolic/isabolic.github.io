name: 🚀 Deploy to Fly 🚀

on:
  push:
  workflow_dispatch:
    branches:
      - main
    paths:
      - "client/**"

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
      name: Deploy app
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v2
        - uses: superfly/flyctl-actions/setup-flyctl@master
        - run: flyctl deploy client/ --remote-only --build-arg REACT_APP_GA_TRACKING_ID="${{ secrets.GA_TRACKING_ID }}"